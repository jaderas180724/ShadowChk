<h3 class="font-semibold mb-4">Gates Disponibles</h3>

<div class="space-y-3">
  <div class="bg-card-bg p-3 rounded-lg text-xs">
    <b>Stripe Auth $0</b><br>
    Gratuita | 0.3 tkn | ~8s
    <button onclick="execGate('stripe')" class="mt-2 w-full bg-accent py-2 rounded">Ejecutar</button>
  </div>

  <div class="bg-card-bg p-3 rounded-lg text-xs">
    <b>Shopify $10</b><br>
    Platinum | 0.4 tkn | ~12s
    <button onclick="execGate('shopify')" class="mt-2 w-full bg-gray-700 py-2 rounded opacity-50">Bloqueado</button>
  </div>
</div>

<script>
function execGate(name) {
  alert("Ejecutando gate: " + name);
  fetch('/api/gate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ gate: name })
  });
}
</script>
